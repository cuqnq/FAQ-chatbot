<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>cuqnq_FAQ Chatbot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="chat-window">
    <div id="messages"></div>
    <div id="input-area">
      <textarea id="user-input" placeholder="Ask a question..." rows="1"></textarea>
      <button id="send-btn">Send</button>
    </div>
    <div id="quick-reply-container">
      <button id="quick-reply-dropdown">Quick Reply</button>
      <div id="quick-reply-menu" class="hidden"></div>
    </div>
  </div>

  <script src="script.js" defer></script>
  <script src="textanimation.js" defer></script>
</body>
</html>
